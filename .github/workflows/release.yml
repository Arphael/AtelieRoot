name: Release
# On a version tag (git tag v1.0.0 && git push --tags) the two downloads are attached:
# AtelierRoot.exe (desktop app) and AtelierRoot.html (the same app as one HTML file).
# Both come from the same dist/index.html, so they always behave the same.
on:
  push: { tags: ['v*'] }
permissions: {}
jobs:
  windows:
    permissions: { contents: write }
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run tauri:build   # runs npm run build, then embeds dist/ in the executable
      - run: |
          mkdir release
          copy src-tauri\target\release\AtelierRoot.exe release\
          copy dist\index.html release\AtelierRoot.html
        shell: cmd
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/AtelierRoot.exe
            release/AtelierRoot.html
