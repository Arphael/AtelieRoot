name: Release
# On a version tag (git tag v1.0.0 && git push --tags) the two downloads are attached:
# AtelieRoot.exe (desktop app) and AtelieRoot.html (the same app as one HTML file), with the
# CHANGELOG.md section of that version as the release text (scripts/release-notes.mjs).
# Both come from the same dist/index.html, so they always behave the same.
on:
  push: { tags: ['v*'] }
permissions: {}
jobs:
  windows:
    permissions: { contents: write }
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # release text = the CHANGELOG section of this tag; no section -> fail before building anything
      - run: node scripts/release-notes.mjs "$TAG" release-notes.md
        shell: bash
        env: { TAG: "${{ github.ref_name }}" }
      - run: npm ci
      - run: npm run tauri:build   # runs npm run build, then embeds dist/ in the executable
      - run: |
          mkdir release
          copy src-tauri\target\release\AtelieRoot.exe release\
          copy dist\index.html release\AtelieRoot.html
        shell: cmd
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          files: |
            release/AtelieRoot.exe
            release/AtelieRoot.html
