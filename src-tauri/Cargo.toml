[package]
name = "atelierroot"
version = "1.0.0"
description = "Local-first Markdown editor"
authors = ["Alejandro Reyes"]
license = "MIT"
repository = "https://github.com/Arphael/AtelierRoot"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
