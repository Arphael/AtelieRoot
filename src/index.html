      </div>

      <button class="tb" id="olBtn" title="Esquema del documento" aria-label="Esquema" data-i18n-title="olBtn.title" data-i18n-aria="olBtn.aria"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="8" y1="12" x2="20" y2="12"></line><line x1="12" y1="18" x2="20" y2="18"></line></svg></button>
